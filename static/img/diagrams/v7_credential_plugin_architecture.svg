<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e1e1e"/>
    </marker>
  </defs>
  <!-- Agent -->
  <rect x="300" y="50" width="200" height="60" rx="10" fill="none" stroke="#1e1e1e" stroke-width="2"/>
  <text x="400" y="85" font-family="Helvetica, Arial" font-size="20" text-anchor="middle" fill="#1e1e1e">Veramo Agent</text>
  <!-- CredentialPlugin -->
  <rect x="300" y="150" width="200" height="60" rx="10" fill="none" stroke="#1e1e1e" stroke-width="2"/>
  <text x="400" y="185" font-family="Helvetica, Arial" font-size="20" text-anchor="middle" fill="#1e1e1e">CredentialPlugin</text>
  <!-- Arrow Agent -> Plugin -->
  <line x1="400" y1="110" x2="400" y2="150" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Providers -->
  <rect x="180" y="270" width="200" height="60" rx="10" fill="none" stroke="#1e1e1e" stroke-width="2"/>
  <text x="280" y="305" font-family="Helvetica, Arial" font-size="18" text-anchor="middle" fill="#1e1e1e">CredentialProviderJWT</text>
  <rect x="420" y="270" width="200" height="60" rx="10" fill="none" stroke="#1e1e1e" stroke-width="2"/>
  <text x="520" y="305" font-family="Helvetica, Arial" font-size="18" text-anchor="middle" fill="#1e1e1e">CredentialProviderLD</text>
  <!-- Arrows Plugin -> Providers -->
  <line x1="400" y1="210" x2="280" y2="270" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="210" x2="520" y2="270" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Label for array -->
  <text x="400" y="240" font-family="Helvetica, Arial" font-size="16" text-anchor="middle" fill="#555">["providers"]</text>
</svg>
