<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e1e1e"/>
    </marker>
  </defs>
  <!-- Client Agent -->
  <rect x="100" y="150" width="200" height="100" rx="10" fill="none" stroke="#1e1e1e" stroke-width="2"/>
  <text x="200" y="205" font-family="Helvetica, Arial" font-size="24" text-anchor="middle" fill="#1e1e1e">Client Agent</text>
  <!-- Server Agent -->
  <rect x="700" y="150" width="200" height="100" rx="10" fill="none" stroke="#1e1e1e" stroke-width="2"/>
  <text x="800" y="205" font-family="Helvetica, Arial" font-size="24" text-anchor="middle" fill="#1e1e1e">Server Agent</text>
  <!-- Request arrow -->
  <line x1="300" y1="200" x2="700" y2="200" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="500" y="190" font-family="Helvetica, Arial" font-size="18" text-anchor="middle" fill="#555">Request (HTTP/DIDComm)</text>
  <!-- Response arrow (dashed) -->
  <line x1="700" y1="220" x2="300" y2="220" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="500" y="250" font-family="Helvetica, Arial" font-size="18" text-anchor="middle" fill="#555">Response</text>
  <!-- Labels for protocols -->
  <text x="200" y="300" font-family="Helvetica, Arial" font-size="16" text-anchor="middle" fill="#777">Runs in Browser/React Native</text>
  <text x="800" y="300" font-family="Helvetica, Arial" font-size="16" text-anchor="middle" fill="#777">Runs on Server (Node.js)</text>
</svg>
